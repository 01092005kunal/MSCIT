<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 20px;
    background: #f0f2f5;
    color: #1f2328;
  }
  .browser-window {
    border: 1px solid #d0d7de;
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(140, 149, 159, 0.2);
    overflow: hidden;
    background: #ffffff;
    max-width: 960px;
    margin: 0 auto;
  }
  .browser-header {
    background: #f6f8fa;
    padding: 10px 16px;
    border-bottom: 1px solid #d0d7de;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .dot-red { background: #ff5f56; }
  .dot-yellow { background: #ffbd2e; }
  .dot-green { background: #27c93f; }
  .url-bar {
    background: #ffffff;
    border: 1px solid #d0d7de;
    border-radius: 4px;
    padding: 4px 14px;
    font-size: 13px;
    color: #57606a;
    flex-grow: 1;
    margin-left: 12px;
    font-family: "Consolas", monospace;
  }
  .content { padding: 24px 32px; min-height: 480px; }
  h2 { margin-top: 0; color: #0969da; font-size: 22px; margin-bottom: 4px; }
  .subtitle { color: #57606a; font-size: 14px; margin-bottom: 16px; }
  hr { border: 0; border-top: 1px solid #d0d7de; margin: 16px 0; }
  table { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 13.5px; }
  th, td { border: 1px solid #d0d7de; padding: 7px 12px; text-align: left; }
  th { background: #f6f8fa; font-weight: 600; }
  tr:nth-child(even) td { background: #fcfcfc; }
  input[type=number], input[type=text], select, textarea {
    padding: 6px 10px;
    border: 1px solid #d0d7de;
    border-radius: 4px;
    font-size: 14px;
    background: #fff;
    font-family: inherit;
  }
  button {
    padding: 6px 14px;
    background: #f6f8fa;
    border: 1px solid #d0d7de;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13.5px;
    font-weight: 500;
    color: #24292f;
    margin-right: 6px;
  }
  button.primary {
    background: #0969da;
    color: white;
    border-color: #0969da;
  }
  .badge-success {
    display: inline-block;
    padding: 4px 10px;
    background: #dafbe1;
    color: #1a7f37;
    border-radius: 4px;
    font-weight: 600;
    font-size: 13px;
  }
  .badge-warn {
    display: inline-block;
    padding: 4px 10px;
    background: #ffebe9;
    color: #cf222e;
    border-radius: 4px;
    font-weight: 600;
    font-size: 13px;
  }
  .card {
    background: #f6f8fa;
    border: 1px solid #d0d7de;
    border-radius: 6px;
    padding: 14px 18px;
    margin-top: 14px;
  }
  pre {
    background: #24292f;
    color: #f0f6fc;
    padding: 12px;
    border-radius: 6px;
    font-family: Consolas, monospace;
    font-size: 13px;
    overflow-x: auto;
  }
</style>
</head>
<body>
<div class="browser-window">
  <div class="browser-header">
    <span class="dot dot-red"></span>
    <span class="dot dot-yellow"></span>
    <span class="dot dot-green"></span>
    <div class="url-bar">http://localhost:4200 (Angular) - Practical 3</div>
  </div>
  <div class="content">
    
        <h2>Practical 3: Timer App</h2>
        <div class="subtitle">Conditional Rendering (*ngIf) and List Rendering (*ngFor)</div>
        <hr>

        <h1 style="font-size: 34px; margin: 8px 0; color: #1a7f37;">Time: 7 seconds</h1>
        <p><span class="badge-success">Status: Timer is Running...</span></p>

        <div style="margin: 16px 0;">
          <button disabled style="opacity: 0.6;">Start</button>
          <button class="primary">Pause</button>
          <button>Lap</button>
          <button>Reset</button>
        </div>
        <hr>

        <h3>Recorded Laps (List Rendering):</h3>
        <table style="max-width: 450px;">
          <thead>
            <tr><th>Lap #</th><th>Recorded Time</th></tr>
          </thead>
          <tbody>
            <tr><td>Lap 1</td><td>3 seconds</td></tr>
            <tr><td>Lap 2</td><td>5 seconds</td></tr>
            <tr><td>Lap 3</td><td>7 seconds</td></tr>
          </tbody>
        </table>
        
  </div>
</div>
</body>
</html>
