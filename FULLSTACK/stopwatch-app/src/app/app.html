<div class="stopwatch">

  <h1>STOPWATCH</h1>

  <div class="display">

    <span>{{ minutes }}</span>
    <span>:</span>
    <span>{{ seconds }}</span>
    <span>.</span>
    <span class="milliseconds">{{ milliseconds }}</span>

  </div>

  <div class="buttons">

    <button
      (click)="start()"
      [disabled]="running">
      START
    </button>

    <button
      (click)="pause()"
      [disabled]="!running">
      PAUSE
    </button>

    <button
      (click)="reset()">
      RESET
    </button>

  </div>

</div>
